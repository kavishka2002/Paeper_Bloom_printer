name: BloomConnect Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: BloomConnect
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: BloomConnect/package-lock.json

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match package version v$version."
          }

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx --no-install electron-builder --win nsis --x64 --publish never

      - name: Verify update assets
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = "BloomConnect-Setup-$version.exe"
          foreach ($path in @("release/$installer", "release/$installer.blockmap", "release/latest.yml", "release/win-unpacked/resources/app-update.yml")) {
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing update file $path." }
          }
          if (!(Select-String -LiteralPath 'release/latest.yml' -SimpleMatch $installer -Quiet)) {
            throw 'Update metadata must reference the uploaded installer filename.'
          }

      - name: Verify packaged app starts
        shell: pwsh
        run: |
          $env:BLOOMCONNECT_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'bloomconnect-package-smoke'
          $env:BLOOMCONNECT_SMOKE_QUICK_PDF = '1'
          $app = Start-Process -FilePath './release/win-unpacked/BloomConnect.exe' -WindowStyle Hidden -PassThru
          if (!$app.WaitForExit(180000)) {
            Stop-Process -Id $app.Id
            throw "Packaged BloomConnect startup timed out."
          }
          $errorLog = Join-Path $env:BLOOMCONNECT_SMOKE_DIR 'smoke-error.txt'
          if (Test-Path -LiteralPath $errorLog) { Get-Content -LiteralPath $errorLog }
          if ($app.ExitCode -ne 0) { throw "Packaged BloomConnect exited with code $($app.ExitCode)." }
          $result = Get-Content -Raw (Join-Path $env:BLOOMCONNECT_SMOKE_DIR 'smoke.json') | ConvertFrom-Json
          if (!$result.setup -or !$result.pdfPreview) { throw "Packaged setup or PDF preview failed." }

      - name: Upload Windows installer and update feed
        uses: actions/upload-artifact@v4
        with:
          name: BloomConnect-Windows-x64
          path: |
            BloomConnect/release/BloomConnect-Setup-*.exe
            BloomConnect/release/BloomConnect-Setup-*.exe.blockmap
            BloomConnect/release/latest.yml
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BloomConnect-Windows-x64
          path: installer

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/*.exe installer/*.exe.blockmap installer/latest.yml \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest
